[project]
name = "pyntara"
version = "0.1.0"
description = "Automated Kubuntu provisioning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pykeepass>=4.1.1",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pycryptodome>=3.20",
]

[project.scripts]
pyntara = "pyntara.pyntara:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyntara"]
