[project]
name = "pyntara"
version = "0.1.0"
description = "Automated Kubuntu provisioning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pykeepass>=4.1.1",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pycryptodome>=3.20",
]

[dependency-groups]
# Developer tooling per docs/guides/developer-guide.md: pytest runs the test
# suite, ruff and mypy --strict are mandatory before every merge.
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# The suite runs in parallel across worker processes; xdist distributes the
# tests at collection time. Each worker builds its own cheap-KDF template
# vault once (tests/conftest.py), so vault tests stay fast in every worker.
addopts = "-n auto"

[project.scripts]
pyntara = "pyntara.pyntara:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyntara"]

[tool.mypy]

[[tool.mypy.overrides]]
# pykeepass ships no type stubs, so mypy cannot analyze it. Treating the
# package as Any keeps mypy --strict green without losing checks on our code.
module = ["pykeepass.*"]
ignore_missing_imports = true

[tool.ruff]
# The secrets maintenance script is a standalone user-invoked utility, not
# part of the application package, so its shebang state is not linted here.
exclude = ["secrets"]
