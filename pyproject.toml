[project]
name = "pyntara"
version = "0.1.0"
description = "Kubuntu automation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.2",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20250516",
]

[project.scripts]
pyntara = "pyntara.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
