[project]
name = "pyntara"
description = "Automated Kubuntu provisioning system"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pykeepass>=4.1.1",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pycryptodome>=3.20",
    "pikepdf>=8.0",
]

[dependency-groups]
# Developer tooling per docs/guides/developer-guide.md: pytest runs the test
# suite, ruff and mypy --strict are mandatory before every merge.
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# By default uv prefers a CPython it downloaded itself over the interpreter of
# the distribution, and that download would decide the version of every
# environment on the machine. The fleet runs the interpreter of the Ubuntu
# archive, which Kubuntu 26.04 ships as python3.14, so uv takes that one.
python-preference = "system"

[tool.pytest.ini_options]
# The suite runs in parallel across worker processes; xdist distributes the
# tests at collection time. Each worker builds its own cheap-KDF template
# vault once (tests/conftest.py), so vault tests stay fast in every worker.
addopts = "-n auto -m 'not live'"
# Live tests touch the real network and the real yggdrasil binary; they
# run only on explicit request (pytest -m live) during development of the
# yggdrasil task, never in the default suite or CI.
markers = [
    "live: network-dependent tests for the yggdrasil peer selection, run manually",
]

[project.scripts]
pyntara = "pyntara.pyntara:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyntara"]

[tool.hatch.version]
# Single version source: src/pyntara/__init__.py holds __version__; the
# landing step raises it once per landing, from hooks/land_version_commit.sh,
# and never on every commit.
path = "src/pyntara/__init__.py"

[tool.mypy]
# The developer guide's gate stays `mypy --strict src`; the bare `mypy`
# invocation checks the tests as well, so a type regression in a test
# helper is caught by default.
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pykeepass and reportlab ship no type stubs, so mypy cannot analyze them.
# Treating the packages as Any keeps mypy --strict green without losing
# checks on our code.
module = ["pykeepass.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
# The secrets maintenance script is a standalone user-invoked utility, not
# part of the application package, so its shebang state is not linted here.
exclude = ["secrets"]
