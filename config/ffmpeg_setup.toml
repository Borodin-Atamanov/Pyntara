[ffmpeg_setup]
# ffmpeg installed by the ffmpeg_setup task from the Ubuntu archive. The
# archive on Kubuntu 26.04 and newer carries a complete GPL ffmpeg build
# (ffmpeg pulls ffmpeg, ffprobe, ffplay and the shared libraries), so apt is
# the whole install path: no third-party repository, no source build and no
# version chase. The task installs whatever the archive carries without
# checking the version or the feature set.
# Seconds the dpkg status query may take.
package_status_timeout_seconds = 30
# Retry attempts after a failed package install; total attempts are retries plus one.
package_install_retries = 3

# The wayrecord bridge records the Wayland screen through the direct KWin
# screencast protocol into ffmpeg: the task compiles the capture engine
# task_data/ffmpeg_setup/wayrecord.c to pyntara-wayrecord and registers it
# as a trusted application through a desktop entry with
# X-KDE-Wayland-Interfaces=zkde_screencast_unstable_v1, so no portal dialog
# is ever shown. The build needs the C toolchain and the Wayland and
# PipeWire development headers, all system packages installed with the task.
# The system path the recording engine is built to.
wayrecord_bin_path = "/usr/local/bin/pyntara-wayrecord"
# The desktop entry that grants the screencast interface to the engine.
wayrecord_desktop_path = "/usr/share/applications/pyntara-wayrecord.desktop"
# The mode of the built recording engine: it is executed by the user, so it
# needs the executable bits and nothing wider.
wayrecord_file_mode = "0755"
# Names of the C sources of the engine under task_data/ffmpeg_setup/ of the
# clone, in compile order.
wayrecord_source_file_names = ["wayrecord.c", "zkde-screencast-client.c"]
# Name of the desktop entry template under task_data/ffmpeg_setup/ of the
# clone; the run substitutes $bin_path with the built engine path.
wayrecord_desktop_template_file_name = "pyntara-wayrecord.desktop"
# Suffix of the staged build next to the engine path: the compiler writes it
# there first, so an unchanged engine is detected by byte comparison.
wayrecord_build_file_suffix = ".build"
# Command that prints the compile flags of the engine; the run appends its
# output to the compile command.
wayrecord_build_flags_command = ["pkg-config", "--cflags", "--libs", "wayland-client", "libpipewire-0.3"]
# Compiler command of the engine. The run substitutes {output} with the
# staged binary path and appends the sources and the resolved flags.
wayrecord_compile_command = ["gcc", "-O2", "-o", "{output}"]

#package set
packages = [
    "ffmpeg", # ffmpeg: audio and video processing tools, ffmpeg/ffprobe/ffplay
    "gcc", # gcc: C compiler, builds the wayrecord capture engine
    "libwayland-dev", # libwayland-dev: Wayland client headers and library, engine build
    "libpipewire-0.3-dev", # libpipewire-0.3-dev: PipeWire headers and library, engine build
    "pkgconf", # pkgconf: pkg-config, resolves engine build flags
]
