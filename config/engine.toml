# Pyntara engine configuration.
# Single source of truth for the values used by the Python part of the
# engine. The config/ directory holds one TOML file per top-level section;
# the loader joins the files in sorted order into a single document before
# parsing (pyntara.config.loader.render_config_source). Every value of the
# run comes from here: the reader takes what the file holds, invents nothing
# and never stops the run, and the checks of this config live in the test
# suite (architecture contract, Configuration). Secrets never live here;
# vault credentials come from the environment.

[engine]
# Directory for runtime task state.
task_data_root = "/var/lib/pyntara/task-data"
# Directory the systemd unit files of the provisioned services are written
# to; several tasks deploy a unit and share this one location.
systemd_unit_dir = "/etc/systemd/system"
# Seconds the resilience notice stays visible.
notice_timeout = 7
# Seconds a provisioning command may run before it is killed. The bound
# stays above the longest single download, so curl reports its own give-up
# instead of being killed from outside.
command_timeout_seconds = 8000
# Per-attempt timeout in seconds of a curl call that queries metadata, for
# example the releases API. A simple request to a server gets at least
# 60 seconds before it is called unreachable.
curl_timeout_seconds = 777
# Per-attempt timeout in seconds of a curl call that downloads a file. A
# download carries megabytes and a slow link must still finish it, so the
# download budget is far larger than the metadata budget.
curl_download_timeout_seconds = 7777
# How many times curl retries a download or release query before giving
# up. The shared curl flags add --retry-all-errors, so every failure is
# retried, not only timeouts and HTTP 5xx.
curl_retries = 17
# Seconds curl waits before the next attempt of a download or release
# query. Three seconds give a flapping server or a short outage the time
# to answer again without stalling the whole retry budget.
curl_retry_delay_seconds = 3
# Seconds curl may spend establishing a connection before an attempt is
# abandoned. A host that drops packets instead of refusing fails fast, so
# the retry budget serves short outages instead of one long silent stall
# (the per-attempt --max-time still bounds the whole transfer). A simple
# request to a server gets at least 60 seconds before it is called
# unreachable.
curl_connect_timeout_seconds = 60
# Total seconds curl may keep retrying before it gives up on its own. The
# bound keeps a dead link from retrying until the outer command timeout
# kills the process; curl reports a clear give-up error first. It matches
# the download budget, so a retry of a large download is not cut short by
# the total window.
curl_retry_max_time_seconds = 7777
# Query URL of the latest release of a GitHub repository; every release
# query of every task uses this one value, with {repo} replaced by the
# configured owner/name pair, so a mirror or a proxy is configured in one
# place instead of five task modules.
github_latest_release_url = "https://api.github.com/repos/{repo}/releases/latest"
# The Python interpreter of the managed system, the one that carries the
# system packages such as python3-dbus. The absolute path keeps a task
# that runs an embedded client independent of the caller PATH, where the
# project venv could shadow python3 with an interpreter that cannot see
# those packages.
system_python = "/usr/bin/python3"
# Identifier under which the engine mirrors its own messages into the
# system journal (bootstrap contract, Logging). It stays distinct from the
# pyntara-install identifier of the bootstrap, so a journal query separates
# the installer from the run it launched.
journal_identifier = "pyntara-engine"
# Syslog priority of a serious failure, 0 to 7.
error_priority = 3
# Syslog priority of task progress actions, 0 to 7. Debug level keeps the
# journal detailed; errors stay at error_priority.
progress_priority = 7
# Seconds the desktop detection process check may take.
process_check_timeout_seconds = 5
# Seconds the engine pauses after showing a task title before running it.
task_start_delay_seconds = 0.5
# Process names whose presence marks a desktop session in the default
# install mode detection. A desktop session variable wins over these;
# the list is checked only when no session variable is set.
desktop_detect_processes = ["kwin_wayland", "kwin_x11", "plasmashell", "gnome-shell"]
# Account of the desktop user, the owner of the live desktop session the run
# reaches. The run reads the session environment of that account once and
# exports it, so a run started over a remote console configures the desktop
# exactly like a run started inside the session. An empty value disables the
# export and leaves every desktop task to apply its settings at the next login.
desktop_username = "i"
# Command that prints the environment of that user's session manager, one
# KEY=VALUE per line; {username} is replaced with desktop_username. The machine
# is named as <user>@.host because the engine runs as root and root has its own
# session manager, which carries none of the desktop variables.
session_environment_command = ["systemctl", "--machine", "{username}@.host", "--user", "show-environment"]
# The session variables the run exports to every task and every child process.
# The list holds the variables of the desktop session only: HOME, PATH,
# SSH_AUTH_SOCK and the locale of the root process are never replaced, because
# they belong to the run and not to the desktop.
session_environment_keys = ["DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY", "XAUTHORITY", "XDG_RUNTIME_DIR", "XDG_SESSION_TYPE", "XDG_SESSION_ID", "XDG_SESSION_CLASS", "XDG_CURRENT_DESKTOP", "DESKTOP_SESSION", "XDG_MENU_PREFIX", "KDE_FULL_SESSION", "KDE_SESSION_VERSION"]
# The session bus variable. It carries the address the DBus clients of the
# tasks connect to, so a task can reach a running service of the session with
# this one value alone.
session_bus_key = "DBUS_SESSION_BUS_ADDRESS"
# The display variables. A GUI tool reaches the compositor or the X server when
# at least one of them carries a value; without one Qt picks a platform plugin
# that cannot connect and the tool aborts. The session counts as live only when
# session_bus_key and one display key are present.
session_display_keys = ["WAYLAND_DISPLAY", "DISPLAY"]
