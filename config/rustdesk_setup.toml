[rustdesk_setup]
# RustDesk remote desktop client: install and configure for unattended
# access. The task installs the newest client release from the GitHub
# releases of github_repo as a deb, registers the machine on the public
# RustDesk rendezvous server and applies the client options below. The
# permanent password is generated per machine (password_words random
# proquint words joined by password_separator), stored in the runtime
# vault entry named by vault_entry_title and applied through
# rustdesk --password, so every machine of the fleet gets its own
# access credential. The machine ID is written to id_file_path so the
# System Metrics collector includes it in the network report
# (docs/spec/rustdesk-setup.md).
github_repo = "rustdesk/rustdesk"
# Directory the downloaded deb is kept in during the install.
download_dir = "/var/cache/pyntara/rustdesk"
# Name of the release asset of the installed version; {version} is the
# release version and {asset_arch} the release architecture the engine
# mapping release_asset_architectures names for this machine.
asset_name_template = "rustdesk-{version}-{asset_arch}.deb"
# Commands of the client binary: the version query, the machine ID query,
# the option read and write and the password set. The placeholders are the
# option key and value and the password, so the arguments the task passes
# are data and the argv is config.
version_check_command = ["rustdesk", "--version"]
machine_id_command = ["rustdesk", "--get-id"]
get_option_command = ["rustdesk", "--option", "{key}"]
set_option_command = ["rustdesk", "--option", "{key}", "{value}"]
set_password_command = ["rustdesk", "--password", "{password}"]
# Commands that stop, enable and start the service unit; {service_unit_name}
# is the unit of this section.
service_stop_command = ["systemctl", "stop", "{service_unit_name}"]
service_enable_command = ["systemctl", "enable", "{service_unit_name}"]
service_start_command = ["systemctl", "start", "{service_unit_name}"]
# Name of the identity file inside config_dir. Force mode removes it, so
# the service generates a fresh machine ID on the next start.
identity_file_name = "RustDesk.toml"
# Seconds one machine ID probe may take inside the readiness loop: the
# query answers as soon as the per-session daemon owns the IPC, so the
# probe is bounded far below the command timeout.
readiness_probe_timeout_seconds = 5
# File that carries the machine RustDesk ID for the network report.
id_file_path = "/var/lib/pyntara/rustdesk_id"
# File mode of the ID file, as an octal string.
id_file_mode = "0644"
# Title of the runtime vault entry that carries the permanent password.
vault_entry_title = "rustdesk_password"
# Name of the rustdesk system service unit.
service_unit_name = "rustdesk.service"
# Number of random proquint words of the permanent password.
password_words = 6
# Separator between the proquint words of the permanent password.
password_separator = " "
# Directory that holds the rustdesk client configuration of the primary
# desktop user. Force mode removes the identity file inside it, so the
# service generates a fresh machine ID on the next start.
config_dir = "/home/i/.config/rustdesk"
# Seconds a single install command may run before it is killed.
install_timeout_seconds = 600
# Seconds the apt index refresh may run.
apt_update_timeout_seconds = 600
# Install attempts after the first one.
install_retries = 2
# Readiness loop after the service start: attempts and the pause between
# them, in seconds. The rustdesk service becomes active when its root
# --service process starts, but the per-session --server process that
# owns the IPC and the machine ID appears a moment later.
start_check_attempts = 10
start_check_retry_delay_seconds = 1.0
# Seconds the service is given to stay up before the final state check.
# RustDesk disables and stops its own unit a moment after the start while
# the stop-service option below carries its stopped value, so a state
# check taken right after the start cannot see that failure: the pause
# comes from this key and the unit is queried after it.
service_settle_delay_seconds = 3.0

# Client options applied through rustdesk --option. Each entry is a
# key/value pair of the rustdesk options table; the task reads the
# current value and sets the option only when it differs, so the options
# are idempotent. An empty value is a value like any other: it clears
# the option, which is how RustDesk itself writes an option that carries
# nothing.
#
# The service-stopped flag comes first: RustDesk sets stop-service to Y
# when the service is stopped on purpose, and its own root service then
# disables and stops the unit at every start, so a machine left with the
# flag set is unreachable however often the service is enabled. Clearing
# the flag is the running value of the option.
[[rustdesk_setup.options]]
key = "stop-service"
value = ""

[[rustdesk_setup.options]]
key = "enable-udp-punch"
value = "Y"

[[rustdesk_setup.options]]
key = "enable-ipv6-punch"
value = "Y"

[[rustdesk_setup.options]]
key = "allow-linux-headless"
value = "Y"

[[rustdesk_setup.options]]
key = "direct-server"
value = "Y"

[[rustdesk_setup.options]]
key = "direct-access-port"
value = "21118"

[[rustdesk_setup.options]]
key = "enable-abr"
value = "Y"

[[rustdesk_setup.options]]
key = "access-mode"
value = "password"
