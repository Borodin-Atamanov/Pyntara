# Pyntara desktop keyboard layout configuration.
# Single source of truth for the kde_keyboard_setup task: which keyboard
# layouts and switch options kxkbrc carries, how the keyboard layout
# indicator displays the current layout, and how the changes are applied
# immediately. The task writes the values with kwriteconfig6 as the target
# user and reloads kwin and the Plasma panel.

[kde_keyboard_setup]
# Packages that must be present: the provider of kwriteconfig6 and
# kreadconfig6 (libkf6config-bin), the DBus client used for the reload
# (qdbus-qt6) and the python3-dbus bindings used to apply layout hotkeys
# through the kglobalaccel daemon. Missing packages are installed by the
# task.
packages = ["libkf6config-bin", "qdbus-qt6", "python3-dbus"]
# The user whose desktop configuration is edited and that user's home and
# config directories.
username = "i"
home_dir = "/home/i"
config_dir = "/home/i/.config"
# The KConfig file names under config_dir that the task manages.
kxkbrc_file_name = "kxkbrc"
appletsrc_file_name = "plasma-org.kde.plasma.desktop-appletsrc"
# The Plasma applet whose display style is the layout indicator.
applet_plugin = "org.kde.plasma.keyboardlayout"
# The keyboard layouts in the order Caps Lock and Shift+Caps Lock cycle
# through: the first is English, the second Russian.
layouts = ["us", "ru", "es"]
# The XKB switch option: Caps Lock to the first layout, Shift+Caps Lock to
# the second layout.
switch_option = "grp:caps_select"
# Whether kwin resets the previous XKB options before applying the
# configured one. This and switch_mode complete the kxkbrc [Layout] group
# the way KDE writes it; kwin applies the switch option at session start
# only when the group is complete, so a minimal group leaves a freshly
# installed session on the default single layout.
reset_old_options = true
# The KDE switch mode written into kxkbrc, part of the complete [Layout]
# group. WinClass is the value KDE writes itself.
switch_mode = "WinClass"
# Whether layout switching is enabled at all.
use_layout_switching = true
# How the keyboard layout indicator shows the current layout; Flag shows
# the country flag instead of the layout name.
indicator_display_style = "Flag"
# Command that makes kwin re-read the keyboard layout configuration, so
# the layouts apply immediately.
kwin_reload_command = ["qdbus6", "org.kde.KWin", "/KWin", "org.kde.KWin.reconfigure"]
# Command that restarts the Plasma panel so the indicator re-reads its
# configuration.
panel_restart_command = ["systemctl", "--user", "--machine", "i@.host", "restart", "plasma-plasmashell.service"]
# Per-layout hotkeys are managed by the kde_settings task through its
# kconfig records, not here. Empty by default: no hotkeys.
layout_switch_shortcuts = {}
# The group of kxkbrc that carries the layout settings and the group of
# the appletsrc applet that carries its configuration.
kxkbrc_group = ["Layout"]
applet_configuration_group = ["Configuration", "General"]
# The KConfig file of the global shortcuts and the keys the task writes in
# kxkbrc, in the order KDE writes them.
shortcuts_file_name = "kglobalshortcutsrc"
kxkbrc_key_layout_list = "LayoutList"
kxkbrc_key_display_names = "DisplayNames"
kxkbrc_key_variant_list = "VariantList"
kxkbrc_key_options = "Options"
kxkbrc_key_reset_old_options = "ResetOldOptions"
kxkbrc_key_switch_mode = "SwitchMode"
kxkbrc_key_use = "Use"
# The appletsrc key that carries the indicator display style.
display_style_key = "displayStyle"
# The boolean spelling of those files, used for every key the task writes
# as a flag.
kconfig_true_value = "true"
kconfig_false_value = "false"
# The component that owns the layout switcher actions in the shortcut
# system: the unique name the daemon knows and the friendly name it shows.
layout_switcher_component_unique = "KDE Keyboard Layout Switcher"
layout_switcher_component_friendly = "Keyboard Layout Switcher"
# The Qt keyboard modifier flags, which the daemon stores combined with
# the key code of a shortcut. The keys are the modifier names a portable
# shortcut may carry; the values are the flags of Qt itself, so a
# shortcut the task applies live can be composed without a Qt library.
shortcut_modifier_bits = { Ctrl = 0x04000000, Alt = 0x08000000, Shift = 0x02000000, Meta = 0x10000000 }
