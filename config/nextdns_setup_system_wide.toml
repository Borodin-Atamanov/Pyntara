[nextdns_setup_system_wide]
# System-wide NextDNS profile selection (docs/spec/nextdns-profile.md).
# The task picks one NextDNS profile per machine from the vault group
# named below, deterministically from the hostname, and records the
# profile ID in the file below. The system-wide resolver is owned by the
# dnsproxy_setup task, which reads the recorded ID.
# Title of the vault subgroup that carries the NextDNS profile accounts.
vault_group_title = "NextDNS"
# Path of the file that records the selected NextDNS profile ID.
# dnsproxy_setup and the System Metrics collector read it
# (docs/spec/system-metrics.md, section Collected data).
profile_id_file_path = "/var/lib/pyntara/nextdns_profile_id"
# File mode of the recorded profile ID file, as an octal string.
profile_id_file_mode = "0644"
# Syslog priority of a serious failure, 0 to 7.
error_priority = 3
