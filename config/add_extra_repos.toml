[add_extra_repos]
# Components the add_extra_repos task ensures in every Ubuntu archive
# section of the apt sources. main is always present on a fresh Kubuntu;
# universe, restricted and multiverse are enabled here.
components = ["main", "universe", "restricted", "multiverse"]
# Official Ubuntu archive hosts the task may manage. A source file whose
# URIs match none of these hosts is third-party and left untouched.
ubuntu_hosts = [
    "archive.ubuntu.com",
    "security.ubuntu.com",
    "ports.ubuntu.com",
    "old-releases.ubuntu.com",
]
# Keep downloaded .deb files in the apt cache after install. When true the
# task writes an apt.conf.d drop-in that stops apt and unattended-upgrades
# from deleting downloaded packages after a successful install.
keep_downloaded_debs = true
# The apt sources the task manages: the legacy single file and the drop-in
# directory. Only lowercase files ending in .list or .sources inside the
# directory are apt sources; everything else is left alone.
legacy_sources_file = "/etc/apt/sources.list"
sources_list_d = "/etc/apt/sources.list.d"
# The apt drop-in that stops apt from deleting downloaded .deb files. The
# task owns this file completely while keep_downloaded_debs is true: it
# writes it, and removes it when the setting is false.
keep_debs_file = "/etc/apt/apt.conf.d/99keep-debs.conf"
