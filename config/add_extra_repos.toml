[add_extra_repos]
# Components the add_extra_repos task ensures in every Ubuntu archive
# section of the apt sources. main is always present on a fresh Kubuntu;
# universe, restricted and multiverse are enabled here.
components = ["main", "universe", "restricted", "multiverse"]
# Official Ubuntu archive hosts the task may manage. A source file whose
# URIs match none of these hosts is third-party and left untouched.
ubuntu_hosts = [
    "archive.ubuntu.com",
    "security.ubuntu.com",
    "ports.ubuntu.com",
    "old-releases.ubuntu.com",
]
# Keep downloaded .deb files in the apt cache after install. When true the
# task writes an apt.conf.d drop-in that stops apt and unattended-upgrades
# from deleting downloaded packages after a successful install.
keep_downloaded_debs = true
# Names of the two deb822 fields the task reads in a .sources file: the
# field that carries the archive URIs and the field that lists the enabled
# components. The comparison is without case, so a distribution that
# renames a field is answered here.
uris_field_name = "uris:"
components_field_name = "components:"
# The apt sources the task manages: the legacy single file and the drop-in
# directory. The directory holds apt sources only in the two formats below;
# a file with any other extension, or with an upper case name, is left alone.
legacy_sources_file = "/etc/apt/sources.list"
sources_list_d = "/etc/apt/sources.list.d"
# Suffix of a one-line sources file (one deb line per entry), the format of
# the legacy sources file.
legacy_source_suffix = ".list"
# Keywords that open a one-line source line, with the space that separates
# the keyword from the rest of the line, so a word that merely starts with
# the letters of a keyword is not taken for a source. The task rewrites the
# lines of these kinds.
legacy_source_type_keywords = ["deb ", "deb-src "]
# URL schemes that mark the archive URI token of a one-line source line. The
# task reads the tokens after the URI and the suite as the components, so a
# mirror scheme the operator adds here is understood instead of refused.
source_url_schemes = ["http://", "https://"]
# Suffix of a deb822 sources file, whose entries are fields. The task reads
# such a file field by field instead of line by line.
deb822_source_suffix = ".sources"
# The apt drop-in that stops apt from deleting downloaded .deb files. The
# task owns this file completely while keep_downloaded_debs is true: it
# writes it, and removes it when the setting is false.
keep_debs_file = "/etc/apt/apt.conf.d/99keep-debs.conf"
# Content of that drop-in: four lines, written exactly as they appear here.
# A file that already matches is left alone, so the task does not rewrite
# a machine that carries the same body.
keep_debs_dropin_content = """
# Written by pyntara add_extra_repos
# Keep downloaded .deb files after install for offline reinstall.
APT::Keep-Downloaded-Packages "true";
Unattended-Upgrade::Keep-Debs-After-Install "true";
"""
