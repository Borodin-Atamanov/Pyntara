[vocalinux_setup]
# Vocalinux voice dictation installed by the vocalinux_setup task for the
# desktop user, from the official AppImage release (the build with the
# precompiled Vulkan pywhispercpp and the CPU fallback, bundling its own
# CPython and GTK). The version is pinned: the task installs exactly the
# release named by version and its asset, and an upgrade is a config
# change, so the app config template and the verified release stay in
# lockstep. The AppImage of the installed version stays in download_dir
# under its asset name; on a rerun a present install file means the pinned
# release is already installed and nothing is downloaded again. The task
# does not download the speech model: the app config selects whisper_cpp
# with the small model, and Vocalinux downloads the model itself on the
# first dictation with its own pinned checksum and progress dialog.
# The user whose desktop runs the app and whose home holds the install.
username = "i"
home_dir = "/home/i"
# Root cache that keeps the AppImage of the pinned version.
download_dir = "/var/cache/pyntara/vocalinux"
# Pinned Vocalinux release, without the leading v of the release tag.
version = "0.16.2"
# Owner and name pair of the Vocalinux repository the release comes from;
# the download URL of the asset is composed from it and the engine template
# github_release_download_url.
github_repo = "VocaHQ/vocalinux"
# Name of the release asset of the pinned version; {version} is the value
# above and {asset_arch} the release architecture the engine mapping
# release_asset_architectures names for this machine.
asset_name_template = "Vocalinux-{version}-{asset_arch}.AppImage"
# System tools the app needs on the Wayland desktop plus the provider of
# kwriteconfig6 that registers the Meta+S consuming shortcut.
packages = ["wtype", "ydotool", "wl-clipboard", "libkf6config-bin"]
# Group that owns /dev/input and /dev/uinput on Kubuntu.
input_group = "input"
# Relative paths under the home of the desktop user: the directory of the
# installed AppImage, the app config, the autostart entry and the empty
# action desktop file that consumes Meta+S.
appimage_dir_relative_path = ".local/share/vocalinux/appimage"
app_config_relative_path = ".config/vocalinux/config.json"
autostart_relative_path = ".config/autostart/vocalinux.desktop"
echo_desktop_relative_path = ".local/share/applications/net.local.echo.desktop"
# Templates under task_data/vocalinux_setup/ of the clone: the app config,
# the autostart entry (rendered with $appimage) and the empty action
# desktop file.
app_config_template_file_name = "config.json"
autostart_template_file_name = "vocalinux.desktop"
echo_desktop_template_file_name = "net.local.echo.desktop"
# The KConfig record of the empty Meta+S consuming shortcut, exactly as the
# KDE System Settings stores a .desktop launch shortcut: the file, the
# group, the entry inside it, the action and the key sequence the action
# holds. Plasma then consumes Meta+S and the S never reaches the focused
# field, while the app-level listener still sees the raw key.
shortcuts_file_name = "kglobalshortcutsrc"
shortcut_group_name = "services"
shortcut_entry_name = "net.local.echo.desktop"
shortcut_action_name = "_launch"
shortcut_key_sequence = "Meta+S"
# ydotool user unit enabled for the desktop user.
service_unit_name = "ydotool.service"
# Seconds a single package status query may run.
package_status_timeout_seconds = 30
# Install attempts after the first one for each package.
package_install_retries = 3
# Modes of the deployed files: the app config and the autostart entry are read
# by the app and the desktop, the AppImage is executed by the user.
user_file_mode = "0644"
executable_file_mode = "0755"
