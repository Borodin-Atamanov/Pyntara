[telegram_setup]
# Telegram Desktop installed by the telegram_setup task for the desktop
# user. The task installs the official static Linux build (the only build
# with the built-in auto-update): the download link latest_url answers a
# redirect to the archive of the newest release, so the task never tracks a
# version list and takes the redirect as the single source of the latest
# release; the name and the format of the archive are never assumed, tar
# detects the compression by itself. The archive of the installed release
# stays in download_dir under the name the redirect gave it; on a rerun a
# present archive with the name the redirect points to plus a present
# Telegram binary means the latest release is already installed and nothing
# is downloaded again. The
# files land under the home of the desktop user so the built-in updater can
# rewrite them: the install directory is home_dir/.local/share/Telegram,
# the launcher entry is home_dir/.local/share/applications/
# telegramdesktop.desktop and the icon is home_dir/.local/share/icons/
# telegram-desktop.png, all derived from home_dir (docs/spec/telegram-setup.md).
# The user whose desktop runs the client and whose home holds the install.
username = "i"
home_dir = "/home/i"
# Root cache that keeps the archive of the last installed version; the
# archive name doubles as the idempotency record.
download_dir = "/var/cache/pyntara/telegram"
# Official download link that redirects to the newest tsetup archive.
latest_url = "https://telegram.org/dl/desktop/linux"
# Official Telegram icon downloaded for the launcher entry.
icon_url = "https://raw.githubusercontent.com/telegramdesktop/tdesktop/dev/Telegram/Resources/art/icon512.png"
# Relative path of the install directory under the home of the desktop
# user. The directory must be writable by that user, because the built-in
# updater replaces the two binaries in place.
install_dir_relative_path = ".local/share/Telegram"
# Relative path of the launcher entry under that home.
launcher_relative_path = ".local/share/applications/telegramdesktop.desktop"
# Relative path of the icon under that home.
icon_relative_path = ".local/share/icons/telegram-desktop.png"
# Name of the client binary, both inside the extracted archive and inside
# the install directory.
binary_file_name = "Telegram"
# Name of the updater binary, the second file the archive carries.
updater_file_name = "Updater"
# Name of the directory inside the extracted archive that holds the two
# binaries.
archive_directory_name = "Telegram"
# Suffix of the partial download file next to the cached archive; the file
# is renamed to the final name only after a complete transfer, so a cached
# archive name always means a complete archive.
partial_download_file_suffix = ".download"
# Prefix of the temporary directory the archive is extracted to.
extract_dir_prefix = "pyntara-telegram-"
# Launcher entry template under task_data/telegram_setup/ of the clone,
# with $binary and $icon as its placeholders.
launcher_template_file_name = "telegramdesktop.desktop"
# Modes of the three deployed files: the launcher entry and the icon are read
# by the desktop, the two binaries are executed by the user.
launcher_file_mode = "0644"
icon_file_mode = "0644"
executable_file_mode = "0755"
