[port_forwarding_setup]
# Auto port forwarding parameters (docs/spec/port-forwarding-setup.md).
# The task deploys the auto_port_forwarding service that, at system
# start, opens the runtime vault, reads the port-forwarding server
# addresses and the passphrase of the port-forwarding key, unlocks the
# key in a dedicated ssh-agent and keeps a reverse ssh tunnel to every
# server, forwarding the local SSH daemon port. The forwarded local port
# itself is not configured here: it is the ssh_daemon_setup Port
# directive, the single source of truth. The key pair lives in
# task_data/ssh_daemon_setup/ and is deployed by the ssh_daemon_setup
# task, which also guarantees the restricted public key line in
# authorized_keys.
# Title of the vault subgroup that carries the port-forwarding server
# addresses, one entry per server with the address in the url field. The
# address may be ipv4, ipv6 or a url. The group is data: the
# regeneration tooling creates it and fills it with its seed entries on
# creation, then never edits them.
vault_group_title = "port_forwarding_servers"
# Title of the vault entry that carries the passphrase of the deployed
# port-forwarding private key. The value must name an entry of the
# [vault_structure] table. The entry exists in every vault with a freshly
# generated passphrase per vault; the default vault's passphrase unlocks
# no deployed key.
passphrase_entry_title = "ssh_passphase_for_port_forwarding"
# User the service connects as on every port-forwarding server.
remote_ssh_user = "i"
# Lower and upper bound of the deterministic desired remote port, derived
# as a function of the machine hostname. The defaults are the Linux kernel
# ephemeral port range, so a desired port that is free on the server falls
# in the same zone the kernel assigns random ports from. When the desired
# port is busy on the server, the service asks for a random port instead
# and records it; the server may grant any port, the bounds do not
# constrain the granted one.
desired_port_min = 32768
desired_port_max = 60999
# ssh keepalive: seconds between alive probes and the number of missed
# probes before the connection is considered dead.
server_alive_interval_seconds = 61
server_alive_count_max = 3
# File modes of the files the service writes, octal strings: the askpass
# helper must be executable by its owner only, the state file private.
askpass_helper_file_mode = "0700"
state_file_mode = "0600"
# Seconds a single ssh connection attempt may take before it is given up.
connect_timeout_seconds = 31
# Seconds the ip call that lists this machine's own addresses may take:
# the addresses decide which vault server is this machine itself.
own_addresses_timeout_seconds = 15
# Seconds the ssh-agent start and the unlock of the port-forwarding key
# may take; the unlock runs ssh-add with the passphrase fed through the
# askpass helper.
agent_start_timeout_seconds = 15
key_unlock_timeout_seconds = 30
# Display the askpass helper of the key unlock is given. ssh-add needs a
# display to run the helper at all, even when the helper answers without a
# dialog; the value is the display name of the machine's desktop session.
askpass_display = ":0"
# Reconnect backoff after a dropped connection: the pause after the first
# drop is backoff_base_seconds, every further consecutive drop multiplies
# the pause by backoff_multiplier until backoff_max_seconds, all whole
# seconds.
backoff_base_seconds = 2
backoff_multiplier = 2
backoff_max_seconds = 1024
# Path of the root-only JSON file that records the assigned remote ports
# per server, so a service restart keeps the ports stable and the System
# Metrics collector reads them into the network report.
state_file_path = "/var/lib/pyntara/port_forwarding_state.json"
# Name of the deployed service unit file.
service_unit_name = "auto_port_forwarding.service"
# Seconds systemd waits before restarting the service after a failure.
service_restart_seconds = 30
# Journal identifier of the service.
journal_identifier = "auto_port_forwarding"
# Name of the unit template under task_data/port_forwarding_setup/ of the
# clone; the run fills its ExecStart, journal and restart placeholders.
service_template_file_name = "auto_port_forwarding.service"
# Python module the deployed unit runs from the shared deployment venv.
service_module_name = "pyntara.port_forwarding"
# The systemctl calls of the task, each carrying the unit name as its
# {service_unit_name} placeholder except the daemon reload.
systemctl_daemon_reload_command = ["systemctl", "daemon-reload"]
systemctl_enable_command = ["systemctl", "enable", "{service_unit_name}"]
systemctl_restart_command = ["systemctl", "restart", "{service_unit_name}"]
systemctl_is_failed_command = ["systemctl", "is-failed", "{service_unit_name}"]
# Readiness loop of the service after a start: attempts and pause between
# two checks. An inactive service is not a failure, because the service
# exits cleanly on a machine whose vault carries no port-forwarding data;
# only the failed state ends the loop as an error.
start_check_attempts = 10
start_check_retry_delay_seconds = 1
# Syslog priority of a serious failure, 0 to 7.
error_priority = 3
# The commands the deployed service runs itself. The own addresses come
# from the ip call below; the port-forwarding key is loaded into a
# dedicated agent, started by agent_start_command and filled by
# key_add_command; the collector is woken by collector_trigger_command,
# and collector_trigger_timeout_seconds bounds that call.
own_addresses_command = ["ip", "-o", "addr", "show"]
agent_start_command = ["ssh-agent", "-s"]
key_add_command = ["ssh-add", "{key_path}"]
collector_trigger_command = ["systemctl", "start", "--no-block", "{service_unit_name}"]
collector_trigger_timeout_seconds = 31
# The ssh call that holds one reverse tunnel open, with every argument
# that is ours to choose: the port, the options that keep the client from
# prompting or offering another identity, the keepalive and connect
# bounds of the values above, the key, the reverse forward and the
# destination. The remote side of the forward binds the address below, so
# a forwarded port is reachable through the server only.
ssh_forward_command = ["ssh", "-p", "{ssh_port}", "-N", "-v", "-o", "ExitOnForwardFailure=yes", "-o", "IdentitiesOnly=yes", "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=accept-new", "-o", "ServerAliveInterval={server_alive_interval_seconds}", "-o", "ServerAliveCountMax={server_alive_count_max}", "-o", "ConnectTimeout={connect_timeout_seconds}", "-i", "{key_path}", "-R", "{remote_port}:{remote_bind_address}:{local_port}", "{user}@{host}"]
remote_bind_address = "localhost"
# Names the service reads from or writes into the environment around the
# agent: the socket and the process id ssh-agent reports, the display the
# helper is given, the askpass variables of ssh and the variable that
# carries the passphrase to the helper. askpass_env is a table of the
# variables the unlock sets; {helper_path} is the helper script below.
agent_socket_env_key = "SSH_AUTH_SOCK"
agent_pid_env_key = "SSH_AGENT_PID"
display_env_key = "DISPLAY"
passphrase_env_key = "PF_KEY_PASSPHRASE"
askpass_env = { SSH_ASKPASS = "{helper_path}", SSH_ASKPASS_REQUIRE = "force" }
# The helper script of the unlock: written next to nothing else in its
# own temporary directory, it prints the passphrase variable and is
# removed right after the key is in the agent. The directory prefix and
# the file name are values, and the content must name passphrase_env_key.
askpass_helper_dir_prefix = "pyntara-pf-"
askpass_helper_file_name = "askpass.sh"
askpass_helper_content = "#!/bin/sh\necho \"$PF_KEY_PASSPHRASE\"\n"
# Seconds between two reads of the ssh output while the service waits for
# the server to confirm or refuse the forward, so the wait costs no spin.
forward_outcome_poll_seconds = 0.2
# State file writing: the suffix of the temporary file the state is
# written through before it is moved into place, and the indentation of
# the JSON it carries.
state_temp_file_suffix = ".tmp"
state_json_indent = 2
