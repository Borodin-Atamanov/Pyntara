[dnsproxy_setup]
github_repo = "AdguardTeam/dnsproxy"
download_dir = "/var/lib/pyntara/dnsproxy-download"
binary_path = "/usr/local/bin/dnsproxy"
service_unit_name = "dnsproxy.service"
service_unit_path = "/etc/systemd/system/dnsproxy.service"
service_template_path = "task_data/dnsproxy_setup/dnsproxy.service"
listen_addresses = ["0.0.0.0", "::"]
listen_port = 53053
conflicting_package_name = "dnscrypt-proxy"
conflicting_service_units = ["dnscrypt-proxy.service", "dnscrypt-proxy.socket"]
doh_url_format = "https://dns.nextdns.io/{profile_id}"
dot_host_format = "tls://{profile_id}.dns.nextdns.io"
doq_host_format = "quic://{profile_id}.dns.nextdns.io"
upstream_mode = "load_balance"
cache_enabled = true
fallback_resolvers = [
  "8.8.8.8", "8.8.4.4", "1.1.1.1", "1.0.0.1", "9.9.9.9", "149.112.112.112",
  "208.67.222.222", "208.67.220.220", "64.6.64.6", "64.6.65.6", "94.140.14.14", "94.140.15.15",
  "185.228.168.9", "185.228.169.9", "84.200.69.80", "84.200.70.40", "1.1.1.2", "1.0.0.2",
  "223.5.5.5", "223.6.6.6", "119.29.29.29", "182.254.116.116", "8.26.56.26", "8.20.247.20",
  "77.88.8.8", "77.88.8.1", "2001:4860:4860::8888", "2001:4860:4860::8844",
  "2606:4700:4700::1111", "2606:4700:4700::1001", "2620:fe::fe", "2620:fe::9",
  "2620:119:35::35", "2620:119:53::53", "2620:74:1b::1:1", "2620:74:1c::2:2",
  "2a10:50c0::ad1:ff", "2a10:50c0::ad2:ff", "2a0d:2a00:1::", "2a0d:2a00:2::",
  "2001:1608:10:25::1c04:b12f", "2001:1608:10:25::9249:d69b", "2606:4700:4700::1112",
  "2606:4700:4700::1002", "2400:3200::1", "2400:3200:baba::1", "2402:4e00::", "2a02:6b8::feed:0ff",
  "2a02:6b8:0:1::feed:0ff"
]
# Bootstrap resolvers dnsproxy uses to resolve the hostnames of the
# encrypted upstream servers before contacting them. The list holds the
# documented anchor addresses (IPv4 and IPv6) of each provider, bare,
# without protocol forms. Each address is reachable over several
# protocols; the access form is chosen by scheme and port, not by
# address: plain DNS IP:53, DNS-over-TLS tls://IP on port 853,
# DNS-over-HTTPS https://IP/dns-query on port 443, DNS-over-QUIC
# quic://IP on port 853, DNSCrypt via its server stamp. Protocols per
# provider below are those documented on the provider's official pages.
# dnsproxy tries all bootstrap entries in parallel and uses the first
# one that answers, so a blocked protocol or port does not stop
# resolution. Bare IP entries exercise plain DNS on port 53; the tls://
# and https:// forms of the same IP are what bypass a blocked port 53.
# The active list is a curated subset of globally reachable anycast
# resolvers with broad protocol support, independent providers, and
# both address families. The full historical list of all providers is
# preserved below as a comment.
bootstrap_resolvers = [
  # Cloudflare: plain, DoT, DoH, DoQ.
  "1.1.1.1", "2606:4700:4700::1111",

  # Google: plain, DoT, DoH.
  "8.8.8.8", "2001:4860:4860::8888",

  # Quad9: plain, DoT, DoH, DoQ, DNSCrypt.
  "9.9.9.9", "2620:fe::fe",

  # AdGuard DNS: plain, DoT, DoH, DoQ, DNSCrypt.
  "94.140.14.14", "2a10:50c0::ad1:ff",

  # NextDNS: plain, DoT, DoH, DoQ.
  "45.90.28.0", "2a07:a8c0::",

  # Cisco OpenDNS: plain, DoT, DoH.
  "208.67.222.222",

  # dns.sb: plain, DoT, DoH.
  "185.222.222.222", "2a09::",

  # CleanBrowsing: plain, DoT, DoH.
  "185.228.168.9",

  # Control D: plain, DoT, DoH, DoQ.
  "76.76.2.0",

  # Mullvad: DoT, DoH.
  "194.242.2.2",

  # Yandex: plain, DoT, DoH.
  "77.88.8.8", "2a02:6b8::feed:0ff",
]

