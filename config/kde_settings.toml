# kglobalshortcutsrc: the keyboard shortcuts for the window effects. KDE
# stores them in the full primary,alternate,description format, so the
# values carry that format with the primary key from the journal. The
# empty active screen bindings are removed instead of written. The task
# unbinds any other action that shares a configured primary key, so a
# configured shortcut wins over conflicts on any target machine.
[[kde_settings.kconfig]]
file = "kglobalshortcutsrc"
group = ["kwin"]
key = "ClearMouseMarks"
value = "Meta+Shift+F11,Meta+Shift+F11,Clear Mouse Marks"

