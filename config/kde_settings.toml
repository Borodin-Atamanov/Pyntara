# Pyntara desktop appearance and input configuration.
# Single source of truth for the kde_settings task: which dark color scheme
# and which dark global theme the desktop uses, the NumLock state on
# startup, the touchpad preferences, the Wayland virtual keyboard, and how
# the changes are applied. The task applies the theme values with the
# plasma-apply tools and the input values with kwriteconfig6 as the target
# user, so the config files stay owned by that user, and the changes apply
# immediately when a desktop session is running.

[kde_settings]
# Packages that must be present: the provider of the plasma-apply theme
# tools (plasma-workspace), the KConfig reader and writer used for the
# idempotency checks and the input settings (libkf6config-bin), and the
# Kubuntu settings that ship the light and dark global themes the native
# day and night switch alternates between (kubuntu-settings-desktop).
# Missing packages are installed by the task.
packages = ["plasma-workspace", "libkf6config-bin", "kubuntu-settings-desktop"]
# The user whose desktop configuration is edited and that user's home
# directory; the KDE tools resolve the config directory under it.
username = "i"
home_dir = "/home/i"
# The dark color scheme applied to all Qt and KDE windows.
color_scheme = "BreezeDark"
# The dark global theme (look and feel) that covers the panel, the widgets,
# the window decorations and the icons.
look_and_feel = "org.kubuntudark.desktop"
# Whether the native KDE day and night theme switch is enabled. When true,
# the task turns the switch on (AutomaticLookAndFeel) and leaves the theme
# itself to the switch, so a run never overwrites the current theme; the
# dark color_scheme and look_and_feel above then describe the night side.
# When false, the task applies the dark theme directly as before.
automatic_look_and_feel = true
# The NumLock state when Plasma starts: on, off or unchanged. Stored in
# kcminputrc [Keyboard] NumLock as 0, 1 or 2.
numlock_on_boot = "off"
# Touchpad preferences, applied to every touchpad found on the target:
# clickfinger, clickareas or none for the click method, and whether the
# internal touchpad is disabled while an external mouse is connected.
touchpad_click_method = "clickfinger"
touchpad_disable_on_external_mouse = true
# The Wayland virtual keyboard: whether it is enabled, the input method
# that provides it and the enabled locales written to plasmakeyboardrc.
virtual_keyboard_enabled = true
virtual_keyboard_input_method = "/usr/share/applications/org.kde.plasma.keyboard.desktop"
virtual_keyboard_locales = ["en_US", "es_MX", "ru_RU"]
# Command that makes kwin re-read its configuration, so a changed Wayland
# input method applies without a session restart.
kwin_reload_command = ["qdbus6", "org.kde.KWin", "/KWin", "org.kde.KWin.reconfigure"]
# Additional KConfig values applied by the task as the target user, one
# table per value. file is the config file name under ~/.config, group is
# the list of group segments, key and value name the key and its string
# form. type is string or bool (bool adds the kwriteconfig6 --type bool
# flag); delete, when true, removes the key instead of writing it and
# value must be absent. Every value is applied only when it differs from
# the current one, so repeated runs skip matching values.
[[kde_settings.kconfig]]
file = "kwinrc"
group = ["TabBox"]
key = "LayoutName"
value = "coverswitch"

[[kde_settings.kconfig]]
file = "kdeglobals"
group = ["Sounds"]
key = "Theme"
value = "freedesktop"

