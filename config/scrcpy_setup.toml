[scrcpy_setup]
# scrcpy installed by the scrcpy_setup task for the desktop user. The
# primary source is the newest release of the configured GitHub repository:
# its linux archive is self-contained (the client, the server pushed to the
# device and its own adb) and needs no system dependency, and the release
# publishes a checksum file next to the archive, so a corrupted download
# never reaches the machine. The Ubuntu archive is the fallback for a
# machine where the release cannot be reached or has no asset for its
# architecture; it carries the distribution build and receives its updates
# through the regular apt upgrade (docs/spec/scrcpy-setup.md).
# The user whose desktop runs the client and whose home holds the install.
username = "i"
home_dir = "/home/i"
# Owner and name pair of the release repository.
github_repo = "Genymobile/scrcpy"
# Name of the release archive with {asset_arch} (the release spelling of
# the dpkg architecture, mapped by the engine release_asset_architectures)
# and {release_tag} substituted. The name is the only thing assumed about
# the archive: the directory inside it is discovered after extraction, so a
# release whose layout changes still installs.
archive_name_template = "scrcpy-linux-{asset_arch}-{release_tag}.tar.gz"
# Checksum file published in the same release, next to the archive.
checksum_file_name = "SHA256SUMS.txt"
# Packages of the fallback source: the distribution client, installed only
# when the release path is unavailable.
fallback_packages = ["scrcpy"]
# Android USB rules package of the Ubuntu archive. The release archive
# carries no udev rules, and without them a desktop user cannot reach a
# device over the cable; the package is installed when it is missing in
# both paths, and a failure is reported with what will not work.
udev_rules_package_name = "android-udev-rules"
# Client binary the Ubuntu archive installs, used for the menu entry and
# for the acceptance check when the fallback path was taken.
apt_binary_path = "/usr/bin/scrcpy"
# Icon name the desktop resolves through the icon theme; used when the
# release tree is not installed, because the distribution places its icon
# in the system theme instead of the install directory.
theme_icon_name = "scrcpy"
# Root cache that keeps the archive of the installed release.
download_dir = "/var/cache/pyntara/scrcpy"
# Relative path of the install directory under the user home; every release
# lands in a directory named after its version inside it, so a new version
# never overwrites a working one.
install_dir_relative_path = ".local/share/scrcpy"
# Relative path of the command in the user prefix: a symbolic link to the
# client inside the version directory, switched only after the new client
# answered its version query.
command_relative_path = ".local/bin/scrcpy"
# Relative paths of the two menu entries under the user home.
launcher_relative_path = ".local/share/applications/scrcpy.desktop"
console_launcher_relative_path = ".local/share/applications/scrcpy-console.desktop"
# Menu entry templates under task_data/scrcpy_setup/ of the clone, with
# $binary and $icon as their placeholders. The console entry exists because
# the client prints the reason it cannot reach a device and the window would
# otherwise close before the user reads it.
launcher_template_file_name = "scrcpy.desktop"
console_launcher_template_file_name = "scrcpy-console.desktop"
# File names inside the release archive, inside the version directory and,
# for the icon, inside the entry substitution.
binary_file_name = "scrcpy"
server_file_name = "scrcpy-server"
adb_file_name = "adb"
icon_file_name = "scrcpy.png"
# Prefix of the temporary directory the archive is extracted into.
extract_dir_prefix = "pyntara-scrcpy-"
# Relative path of the user trash; a superseded version directory is moved
# there, never deleted.
trash_dir_relative_path = ".local/share/Trash/files"
# Client version query, with the client path as its placeholder. The answer
# proves that the delivered artifact runs on this machine; the version the
# task compares for idempotency is read from the symbolic link instead.
version_command = ["{binary}", "--version"]
# Checksum query, with the file as its placeholder: the printed digest is
# compared with the line of the published checksum file that names the
# archive. sha256sum reports a file it cannot read as a nonzero exit.
checksum_command = ["sha256sum", "{file}"]
# Archive extraction, with the archive and the directory as its
# placeholders.
archive_extract_command = ["tar", "--extract", "--gzip", "--file", "{archive}", "--directory", "{extract_dir}"]
# Modes of the deployed files: the menu entries are read by the desktop, the
# client and its adb are executed.
launcher_file_mode = "0644"
executable_file_mode = "0755"
# Seconds the dpkg status query may take, and the retry attempts after a
# failed package install of the fallback path.
package_status_timeout_seconds = 30
package_install_retries = 3
