[i2pd_service_setup]
# i2pd anonymous network router parameters (docs/spec/i2pd-service.md).
# The task installs the newest i2pd release from the GitHub repository as
# a system service and owns the main configuration file.
# GitHub repository of i2pd, owner/name form used by the releases API.
github_repo = "PurpleI2P/i2pd"
# Directory for the downloaded package file.
download_dir = "/var/lib/pyntara/i2pd-download"
# Path of the distribution identity file the task reads to check that the
# deb packages apply to this system and to name the release asset.
os_release_file_path = "/etc/os-release"
# Name of the systemd service unit installed by the package.
service_unit_name = "i2pd.service"
# Main configuration file the task writes. It must match the --conf path
# of the package unit, otherwise the rendered values are ignored.
config_path = "/etc/i2pd/i2pd.conf"
# i2pd log verbosity: debug, info, warn, error or none.
log_level = "warn"
# Total router bandwidth limit in kilobytes per second; 100 Mbit/s is
# 12500 KB/s. The limit applies to both directions combined.
bandwidth = 12500
# Percentage of the router bandwidth shared for transit traffic; 1 means
# one percent, so the transit limit is bandwidth * share / 100.
share = 1
# Whether the web console is enabled (http.enabled of i2pd.conf).
http_enabled = false
# Whether the SOCKS proxy is enabled (socksproxy.enabled of i2pd.conf).
socks_proxy_enabled = true
# Port the SOCKS proxy listens on (socksproxy.port of i2pd.conf). The
# proxy is the way an ssh client reaches this machine over I2P, so the
# port is a value of this table and not a guessed default: the network
# telemetry builds the ssh command through exactly this address.
socks_proxy_port = 4447
# Retry attempts after a failed package install; total attempts are
# retries plus one.
install_retries = 3
# Readiness loop of the forking service: attempts and pause between two
# is-active checks after start or restart.
start_check_attempts = 5
# Pause in seconds between two readiness checks.
start_check_retry_delay_seconds = 1
# Owned tunnels configuration file with the SSH server tunnel. The main
# configuration names it through tunconf, so i2pd reads exactly this
# file wherever it is placed. The tunnel port is not configured here: it
# is read from the ssh_daemon_setup Port directive, so the tunnel and
# the SSH daemon never diverge.
tunnels_config_path = "/etc/i2pd/tunnels.conf"
# Section name of the SSH server tunnel in tunnels.conf.
tunnel_name = "ssh"
# Local address the tunnel forwards to; the SSH daemon listens on it
# because the tunnel connects from the same machine.
tunnel_host = "127.0.0.1"
# Identity file of the tunnel destination, created by i2pd on the first
# start. The file lives in the i2pd data directory (/var/lib/i2pd), the
# only place the i2pd process may write: the AppArmor profile grants
# read-only access to /etc/i2pd, and i2pd resolves every keys path
# against its data directory anyway, so the tunnels file carries only
# the file name. The task computes the .b32.i2p address from this file,
# so the address survives restarts.
tunnel_keys_path = "/var/lib/i2pd/ssh.dat"
# Path of the saved SSH tunnel address file. The task writes the
# computed .b32.i2p address here once the identity exists, and the
# deployed address command reads this file as the fallback when the
# live keys file cannot be decoded (docs/spec/i2pd-service.md).
address_file_path = "/var/lib/pyntara/i2pd_ssh_address"
# File mode of the saved address file, as an octal string. The address
# is not secret, so the file is readable by every user.
address_file_mode = "0644"
# Name templates of the two candidate .deb assets of a release, formatted
# with {release_tag}, {codename} and {arch}. The codename-specific build
# wins, because it is built against this distribution; the generic build
# is the fallback, so a release without a build for this codename still
# installs.
codename_asset_name_template = "i2pd_{release_tag}-1{codename}1_{arch}.deb"
generic_asset_name_template = "i2pd_{release_tag}-1_{arch}.deb"
# Key of the os-release file that carries the distribution codename the
# codename-specific asset name is built from.
os_release_codename_key = "VERSION_CODENAME"
# Command that prints the installed version; the task reads the first
# dotted version triple from its output. A missing binary or a nonzero
# exit means i2pd is not installed, so the task reinstalls it.
version_command = ["i2pd", "--version"]
# Command that enables the service unit; {service_unit_name} is replaced
# with the unit name above.
service_enable_command = ["systemctl", "enable", "{service_unit_name}"]
# Command that starts the service unit when it is inactive.
service_start_command = ["systemctl", "start", "{service_unit_name}"]
# Command that restarts the service unit when it is already active.
service_restart_command = ["systemctl", "restart", "{service_unit_name}"]
# Names of the two templates under task_data/i2pd_service_setup/ of the
# clone: the main configuration and the tunnels file. The run fills their
# placeholders with the values of this table.
config_template_file_name = "i2pd.conf"
tunnels_template_file_name = "tunnels.conf"
# Boolean spelling i2pd accepts in its configuration file. The rendered
# file, the idempotency comparison and the written file share it, so one
# representation covers all three.
config_true_value = "true"
config_false_value = "false"
# Readiness loop of the tunnel identity: the keys file appears only after
# the first start of the router, so the task repeats the decode with a
# pause until these attempts run out and then reports what it found.
address_check_attempts = 10
address_check_retry_delay_seconds = 2
# Name the record of this channel carries in the network report, so a
# reader sees which network the reported ssh command goes through.
report_channel_name = "i2p"
