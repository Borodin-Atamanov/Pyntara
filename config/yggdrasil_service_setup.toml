[yggdrasil_service_setup]
# Yggdrasil network router parameters (docs/spec/yggdrasil-service.md).
# The task installs the newest yggdrasil release from the GitHub
# repository as a system service and owns the configuration and the node
# key: the key lives in a separate PEM file referenced by PrivateKeyPath,
# so config rewrites never change the node identity.
# GitHub repository of yggdrasil, owner/name form used by the releases
# API.
github_repo = "yggdrasil-network/yggdrasil-go"
# Directory for the downloaded package file.
download_dir = "/var/lib/pyntara/yggdrasil-download"
# Name of the systemd service unit installed by the package.
service_unit_name = "yggdrasil.service"
# Retry attempts after a failed package install; total attempts are
# retries plus one.
install_retries = 3
# Name template of the release asset the task installs: {version} is the
# release tag without its prefix and {arch} the dpkg architecture.
asset_name_template = "yggdrasil-{version}-{arch}.deb"
# Prefix the release tag of the repository carries and the version does
# not, so the version used in the asset name and in the idempotency
# comparison is the tag without this prefix.
release_tag_prefix = "v"
# Main configuration file the task writes. It must match the
# DefaultConfigFile embedded in the package, otherwise the values are
# ignored.
config_path = "/etc/yggdrasil/yggdrasil.conf"
# PEM file with the node private key, referenced by PrivateKeyPath. The
# task extracts the key from the package-generated config once, so the
# node identity survives config rewrites.
private_key_path = "/etc/yggdrasil/private-key.pem"
# File mode of the configuration file, octal string.
config_file_mode = "0640"
# File mode of the private key PEM file, octal string.
private_key_file_mode = "0600"
# File mode of the NetworkManager unmanaged-devices drop-in, octal string.
nm_unmanaged_conf_file_mode = "0644"
# TUN interface name; a fixed name instead of auto.
if_name = "ygg"
# TUN interface MTU; the yggdrasil range is 1280 to 65535.
if_mtu = 65535
# Admin socket URI used by yggdrasilctl.
admin_listen = "unix:///var/run/yggdrasil/yggdrasil.sock"
# Inbound listener URIs; [::] binds IPv4 and IPv6, port 0 picks a random
# free port. wss, socks and sockstls are not supported as listeners.
listen = ["tcp://[::]:0", "tls://[::]:0", "quic://[::]:0", "ws://[::]:0"]
# Full peer list storage next to the config; the task saves the whole
# downloaded list here for reference, but only the selected working
# peers go into the configuration.
peers_full_path = "/etc/yggdrasil/peers-full.txt"
# Tarball of the official public-peers repository, the peer list source.
peers_tarball_url = "https://codeload.github.com/yggdrasil-network/public-peers/tar.gz/refs/heads/master"
# How many peers are probed in one batch.
peer_batch_size = 100
# How many working peers to keep in the final configuration.
peer_target_count = 11
# How long to wait for a batch to connect before reading the journal.
# The connections arrive in a wave some 30-35 seconds after the restart,
# because the dials to the batch run with a bounded parallelism and the
# dead peers eat their timeout; 60 seconds leaves a safe margin.
peer_probe_timeout_seconds = 60
# How many batches to try before keeping the last one; 0 means the whole
# list.
peer_max_batches = 0
# Fallback peer list used when the download fails. Pick 2-3 nearby nodes
# from https://publicpeers.neilalexander.dev/ or the public-peers
# repository.
static_peers = []
# Path of the saved node self address file. The task writes the address
# reported by the admin socket here once the node is provisioned, and
# the deployed address command reads this file as the fallback when the
# live query fails (docs/spec/yggdrasil-service.md).
address_file_path = "/var/lib/pyntara/yggdrasil_self_address"
# File mode of the saved address file, as an octal string. The address
# is not secret, so the file is readable by every user.
address_file_mode = "0644"
# Retry of the self address save after the final restart: the admin
# socket is not ready immediately, so the getSelf query is repeated
# with the geometric backoff while the total retry budget lasts. The
# first wait is address_save_retry_base_seconds, every further failure
# multiplies the pause by address_save_retry_multiplier until the
# budget address_save_retry_max_seconds is spent
# (docs/spec/yggdrasil-service.md).
address_save_retry_base_seconds = 1
address_save_retry_multiplier = 2
address_save_retry_max_seconds = 67
# Retry of the live connection check after the final restart: the
# peers need a moment to re-establish their connections, so the admin
# socket query is repeated with the geometric backoff while the total
# retry budget lasts, mirroring the address save
# (docs/spec/yggdrasil-service.md).
connection_wait_base_seconds = 1
connection_wait_multiplier = 2
connection_wait_max_seconds = 30
# Name the record of this channel carries in the network report, so a
# reader sees which network the reported ssh command goes through.
report_channel_name = "yggdrasil"
# NetworkManager conf drop-in that marks the yggdrasil interface as
# unmanaged, so NetworkManager never assumes it as an external device
# and no other task can persist an ephemeral profile for it.
# (docs/spec/yggdrasil-service.md).
nm_unmanaged_conf_path = "/etc/NetworkManager/conf.d/yggdrasil-unmanaged.conf"
# Directory holding the netplan YAML files that back NetworkManager
# connections; a leftover connection for the yggdrasil interface is
# moved here aside as a .bak when the service is cleaned up.
# (docs/spec/yggdrasil-service.md).
netplan_dir_path = "/etc/netplan"
# Command that reports the installed version; the version triple is
# searched in its output with a regular expression (spec Exceptions).
installed_version_command = ["yggdrasil", "-version"]
# Command that exports the node private key from the package-generated
# configuration; {config_path} is the configured configuration file.
export_key_from_config_command = [
    "yggdrasil",
    "-useconffile",
    "{config_path}",
    "-exportkey",
]
# Command that generates a fresh configuration document on stdout, used
# when neither the key file nor the package configuration exists.
generate_config_command = ["yggdrasil", "-genconf", "-json"]
# Command that exports the key from a configuration read on stdin, so the
# freshly generated document is exported without touching the disk.
export_key_from_stdin_command = ["yggdrasil", "-useconf", "-exportkey"]
# Command that reports every connected peer with its latency through the
# admin socket; the -json flag is part of the call, because the shared
# parser reads JSON and the admin socket prints a table without it.
peers_latency_command = ["yggdrasilctl", "-json", "getPeers"]
# Command that reports the node self address through the admin socket.
# The deployed address command runs this same call, so the node address
# is read the same way by the task and by the collector.
self_address_command = ["yggdrasilctl", "-json", "getSelf"]
# Journal query of one probe window: the unit, the window of the last
# {probe_seconds} seconds and a timestamp format a machine can compare.
journal_connected_query_command = [
    "journalctl",
    "-u",
    "{service_unit_name}",
    "--since",
    "-{probe_seconds}s",
    "--no-pager",
    "--output=short-iso",
]
# systemctl calls of the task, each carrying the unit name as its
# placeholder.
service_start_command = ["systemctl", "start", "{service_unit_name}"]
service_restart_command = ["systemctl", "restart", "{service_unit_name}"]
service_enable_command = ["systemctl", "enable", "{service_unit_name}"]
# NetworkManager and iproute2 calls of the unmanaged rule and of the
# leftover interface cleanup, each carrying the name it acts on.
nmcli_reload_command = ["nmcli", "general", "reload"]
nmcli_connection_show_command = [
    "nmcli",
    "connection",
    "show",
    "{connection_name}",
]
nmcli_connection_delete_command = [
    "nmcli",
    "connection",
    "delete",
    "{connection_name}",
]
ip_link_show_command = ["ip", "link", "show", "dev", "{interface_name}"]
ip_link_delete_command = ["ip", "link", "del", "{interface_name}"]
# Body of the NetworkManager drop-in that marks the yggdrasil interface
# as unmanaged, so NetworkManager never assumes the device and no task
# can persist an assumed profile for it; {interface_name} is the
# configured interface name.
nm_unmanaged_conf_body = "[keyfile]\nunmanaged-devices=interface-name:{interface_name}\n"
# Line a netplan YAML carries for the yggdrasil connection; the file that
# holds it is the one that would recreate the leftover interface.
netplan_interface_marker = 'connection.interface-name: "{interface_name}"'
# Suffix of the netplan YAML files the task inspects in netplan_dir_path.
netplan_file_suffix = ".yaml"
# Suffix a netplan profile is moved aside with, so netplan stops reading
# it and cannot regenerate the deleted connection at the next boot.
netplan_backup_suffix = ".bak"
# Prefix and suffix of the temporary file the peer tarball is downloaded
# into before it is unpacked.
peers_tarball_temp_prefix = "yggdrasil-peers-"
peers_tarball_temp_suffix = ".tar.gz"
# Suffix of the markdown files of the public-peers repository that carry
# the peer URIs.
peer_markdown_suffix = ".md"
# Separator of the lines of the text files the task writes, so the saved
# peer list and the saved address file carry one line each and no file
# ends without a final separator.
line_separator = "\n"
# Indentation of the JSON configuration document the task renders, in
# spaces; the rendered file and the comparison that decides whether it
# must be rewritten share it.
config_json_indent = 2
# Key names of the yggdrasil configuration document the task renders and
# reads back. The schema belongs to yggdrasil, so it is visible here
# instead of hidden in the task module (docs/spec/yggdrasil-service.md).
[yggdrasil_service_setup.config_document_keys]
private_key_path = "PrivateKeyPath"
admin_listen = "AdminListen"
if_name = "IfName"
if_mtu = "IfMTU"
listen = "Listen"
multicast_interfaces = "MulticastInterfaces"
multicast_regex = "Regex"
multicast_beacon = "Beacon"
multicast_listen = "Listen"
peers = "Peers"
# Field names of the JSON document the admin socket answers with, shared
# by the task and by the deployed address command.
[yggdrasil_service_setup.admin_output_keys]
address = "address"
peers = "peers"
remote = "remote"
latency = "latency"
# Multicast peer discovery: regex of interface names, beacon (advertise
# presence) and listen (connect to discovered neighbours). One block
# matching every interface with both switches covers the local network.
[[yggdrasil_service_setup.multicast_interfaces]]
regex = ".*"
beacon = true
listen = true
