[ssh_client_setup]
# System-wide SSH client parameters (docs/spec/ssh-client-setup.md). The
# task patches the client configuration through a drop-in, never through
# ssh_config itself, which is only checked for an Include directive that
# pulls the drop-in directory in. Directives are written through augeas
# under the Host * block, so they apply to every connection; a directive
# that is already present with the same value is left untouched, a
# directive with a different value is updated, and a directive that is
# no longer configured is removed.
# Main SSH client configuration file, never rewritten by the task.
ssh_config_path = "/etc/ssh/ssh_config"
# Drop-in configuration file the task owns, written through augeas under
# the Host * block.
ssh_config_dropin_path = "/etc/ssh/ssh_config.d/pyntara.conf"
# File mode of the rendered drop-in, as an octal string.
dropin_file_mode = "0644"
# Ownership comment of the drop-in. It is written without the leading hash,
# because augeas stores and writes comment values without it.
dropin_header = "Managed by the Pyntara ssh_client_setup task."
# augeas lens for the ssh_config syntax, the container node the directives
# are placed under, and the pattern that node carries, so they apply to
# every connection.
augeas_lens = "Ssh.lns"
augeas_container = "Host"
augeas_container_value = "*"
# Package that provides the augtool command line tool used to write the
# drop-in. The task installs it itself when the tool is missing, so it
# never waits for another task to provide augeas.
augeas_tools_package_name = "augeas-tools"
# Seconds the dpkg status query may take.
package_status_timeout_seconds = 30
# Retry attempts after a failed package install; total attempts are
# retries plus one.
install_retries = 3

[[ssh_client_setup.directives]]
name = "AddressFamily"
value = "any"

[[ssh_client_setup.directives]]
name = "CheckHostIP"
value = "no"

[[ssh_client_setup.directives]]
name = "Compression"
value = "yes"

[[ssh_client_setup.directives]]
name = "ConnectionAttempts"
value = "17"

[[ssh_client_setup.directives]]
name = "ConnectTimeout"
value = "31"

[[ssh_client_setup.directives]]
name = "NumberOfPasswordPrompts"
value = "5"

[[ssh_client_setup.directives]]
name = "PasswordAuthentication"
value = "yes"

[[ssh_client_setup.directives]]
name = "TCPKeepAlive"
value = "yes"

[[ssh_client_setup.directives]]
name = "ServerAliveInterval"
value = "61"

[[ssh_client_setup.directives]]
name = "ServerAliveCountMax"
value = "17"

[[ssh_client_setup.directives]]
name = "PreferredAuthentications"
value = "publickey,password"

[[ssh_client_setup.directives]]
name = "StrictHostKeyChecking"
value = "accept-new"
