name: checks

# The gates of docs/guides/developer-guide.md run on every push and every
# pull request, so a red tree is visible without anyone remembering to run
# the checks. The job calls the same script a developer runs by hand, so
# the pipeline and the local run check exactly the same set.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # The fleet runs the interpreter of the Ubuntu archive, and uv must
      # never decide the version by downloading one itself
      # (docs/guides/developer-guide.md, quick start). A missing 3.14 stops
      # the job loudly instead of silently building on another interpreter.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install uv
        run: python -m pip install uv
      - name: sync the environment
        run: uv sync
      - name: run the gates
        run: scripts/check_gates.sh
