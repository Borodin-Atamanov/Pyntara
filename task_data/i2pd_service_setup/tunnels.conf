# Managed by Pyntara i2pd_service_setup. Do not edit by hand.
# The SSH server tunnel: i2pd publishes this destination and forwards
# every incoming I2P connection to the local SSH daemon. The port is the
# sshd Port directive from ssh_daemon_setup, so the tunnel and the
# daemon never diverge.
[$tunnel_name]
type = server
host = $tunnel_host
port = $tunnel_port
keys = $tunnel_keys_path
