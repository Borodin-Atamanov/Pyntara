# Managed by Pyntara i2pd_service_setup. Do not edit by hand.
# The rendered options below are the only values the task owns; every
# other option keeps the i2pd built-in default, so a package upgrade
# that gains new options never conflicts with this file.
loglevel = $log_level

# Total router bandwidth limit in kilobytes per second and the
# percentage of it shared for transit traffic.
bandwidth = $bandwidth
share = $share

# The tunnels file with the SSH server tunnel; naming it here makes
# i2pd read exactly the owned file wherever it is placed.
tunconf = $tunnels_config_path

[http]
enabled = $http_enabled

[socksproxy]
enabled = $socks_proxy_enabled
