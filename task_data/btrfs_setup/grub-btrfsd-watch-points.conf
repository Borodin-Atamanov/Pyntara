[Unit]
# The daemon watches the mounted points, so it starts after that mount instead
# of watching a stale directory inode.
RequiresMountsFor=$points_mount_point

[Service]
# The shipped unit watches the snapper directory of the root. The line is
# cleared first and replaced by the points mount, which is where Pyntara keeps
# its save points. The watch is recursive, so a change inside a work copy also
# reaches the generated list.
ExecStart=
ExecStart=$daemon_path $syslog_option $watch_option $points_mount_point
