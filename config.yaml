target_platform: kubuntu-26.04
timeouts:
  command_sec: 300
  task_sec: 3600
passwords:
  root_length: 20
  user_length: 16
paths:
  task_data_dir: task_data
  secrets_dir: secrets
retry:
  base_seconds: 1.0
  multiplier_mode: sqrt2
logging:
  command_output_to_console: true
  command_output_to_log: true
  datetime_format: "%Y-%m-%d-%H-%M-%S"
