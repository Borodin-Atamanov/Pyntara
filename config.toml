# Pyntara engine configuration.
# Single source of truth for the values used by the Python part of the
# engine. The file is mandatory: a missing or invalid config stops the run,
# there are no defaults. Secrets never live here; vault credentials come
# from the environment (architecture contract section 3).

[engine]
# Directory for runtime task state.
task_data_root = "/var/lib/pyntara/task-data"
# Seconds the resilience notice stays visible.
notice_timeout = 7
# Seconds a provisioning command may run before it is killed.
command_timeout_seconds = 1800
# Seconds the desktop detection process check may take.
process_check_timeout_seconds = 5
# Seconds the engine pauses after showing a task title before running it.
task_start_delay_seconds = 0.5
# Process names whose presence marks a desktop session in the default
# install mode detection. A desktop session variable wins over these;
# the list is checked only when no session variable is set.
desktop_detect_processes = ["kwin_wayland", "kwin_x11", "plasmashell", "gnome-shell"]

[cli_tools]
# Console utilities installed by the cli_tools task.
# Seconds the dpkg status query may take.
package_status_timeout_seconds = 30
# Retry attempts after a failed package install; total attempts are retries plus one.
package_install_retries = 3
# Minimum installed share of the package set, in percent, for the task to
# succeed. Below this share the task fails; a single failing package is not
# fatal by itself.
package_success_threshold_percent = 70

#package set
packages = [
    # shell completion
    "bash-completion", # bash-completion: programmable completion for the bash shell
    "complete-alias", # complete-alias: tab completion for shell aliases
    "hstr", # better history in console

    # file operations
    "tree", # tree: displays an indented directory tree, in color
    "rsync", # rsync: fast, versatile, remote and local file-copying tool

    # storage monitoring
    "lsof", # lsof: utility to list open files
    "smartmontools", # smartmontools: control and monitor storage systems via S.M.A.R.T.

    # security and cryptography
    "gnupg", # gnupg: GNU privacy guard, a free PGP replacement
    "ca-certificates", # ca-certificates: common CA certificates for TLS verification
    "openssl", # openssl: OpenSSL cryptographic toolkit
    "sshpass", # sshpass: non-interactive SSH password authentication

    # terminal multiplexers
    "tmux", # tmux: terminal multiplexer with sessions and windows
    "screen", # screen: terminal multiplexer with VT100/ANSI terminal emulation

    # file managers
    "mc", # mc: Midnight Commander, two-panel console file manager
    "nnn", # nnn: lightweight terminal file browser

    # archivers
    "unrar", # unrar: extractor for the proprietary RAR archive format
    "unrar-free", # unrar-free: free replacement for unrar
    "unzip", # unzip: ZIP archive extractor
    "7zip", # 7zip: modern 7-Zip archiver, replaces the removed p7zip-full
    "xz-utils", # xz-utils: XZ and LZMA compression tools
    "zstd", # zstd: Zstandard compression tool with high ratio and speed
    "lrzip", # lrzip: long-range ZIP, compression for large files
    "pigz", # pigz: parallel gzip implementation using all CPU cores
    "lz4", # lz4: extremely fast LZ4 compression tool

    # system information
    "inxi", # inxi: full system information report
    "lsscsi", # lsscsi: list SCSI and other storage devices
    "lshw", # lshw: detailed hardware information

    # resource monitoring
    "htop", # htop: interactive process viewer
    "nmon", # nmon: system performance monitor for CPU, memory, network, disk
    "ncdu", # ncdu: disk usage analyzer with interactive curses interface

    # network tools
    "net-tools", # net-tools: classic networking tools, ifconfig, netstat, route, arp
    "nmap", # nmap: network scanner
    "tcpdump", # tcpdump: command-line packet analyzer
    "traceroute", # traceroute: trace the network path to a remote host
    "whois", # whois: client for the whois directory service
    "wget", # wget: non-interactive network downloader
    "bind9-dnsutils", # bind9-dnsutils: DNS utilities dig, nslookup and host; the real package behind the transitional dnsutils
    "nload", # nload: console network traffic monitor
    "speedometer", # speedometer: console bandwidth usage meter
    "bmon", # bmon: bandwidth monitor with interactive curses interface
    "iftop", # iftop: real-time bandwidth usage by connection
    "nethogs", # nethogs: per-process network traffic monitor
    "iptraf-ng", # iptraf-ng: interactive IP network traffic monitor

    # disk and file tools
    "exfat-fuse", # exfat-fuse: read and write exFAT filesystems through FUSE
    "fdupes", # fdupes: find and remove duplicate files

    # media tools
    "mediainfo", # mediainfo: technical details of media files, codecs and streams
    "exiftool", # exiftool: read and write EXIF and IPTC metadata in media files

    # automation and configuration
    "expect", # expect: automate interactive terminal programs
    "augeas-tools", # augeas-tools: command-line tools for the Augeas configuration editor

    # small utilities
    "calc", # calc: arbitrary precision calculator
    "hollywood", # hollywood: decorative fake Hollywood-style terminal activity
]

[add_extra_repos]
# Components the add_extra_repos task ensures in every Ubuntu archive
# section of the apt sources. main is always present on a fresh Kubuntu;
# universe, restricted and multiverse are enabled here.
components = ["main", "universe", "restricted", "multiverse"]
# Official Ubuntu archive hosts the task may manage. A source file whose
# URIs match none of these hosts is third-party and left untouched.
ubuntu_hosts = [
    "archive.ubuntu.com",
    "security.ubuntu.com",
    "ports.ubuntu.com",
    "old-releases.ubuntu.com",
]

[swapfile_service_install]
# Swap file path and size calculation. The task creates a swapfile at the
# given path and a systemd service to activate it at boot. The size is
# min(RAM * ram_multiplier + ram_extra_mb, free_disk * disk_fraction).
# Path to the swap file.
swapfile_path = "/swapfile"
# Multiplier applied to installed RAM to get the base swap size.
ram_multiplier = 1.6
# Extra mebibytes added to the RAM-derived swap size before the disk cap.
ram_extra_mb = 4096
# Maximum share of free disk space the swap file may occupy, 0.0 to 1.0.
disk_fraction = 0.5
# File mode of the created swapfile, as an octal string.
swapfile_mode = "0600"
# Accepted deviation between the existing and the target swap size, in
# mebibytes; a swapfile within the tolerance is not recreated.
size_tolerance_mb = 1
# Name of the systemd oneshot service unit that activates the swap at boot.
service_unit_name = "swapfile.service"

[zswap_service]
# Compressed swap cache parameters. The zswap_service task writes these
# values into /sys/module/zswap/parameters and installs a systemd oneshot
# service that repeats the writes at every boot. The values are aggressive:
# zstd compresses stronger than the lzo default, the pool may grow to the
# configured percentage of RAM, and accept_threshold_percent 100 disables
# the hysteresis so the pool accepts pages until the limit is hit.
# Whether the compressed cache is enabled at all.
enabled = true
# Compression algorithm; zstd is the strongest available on Kubuntu.
compressor = "zstd"
# Maximum share of RAM the compressed pool may occupy, in percent.
max_pool_percent = 12
# Percent of the pool limit at which zswap starts accepting pages again
# after being full; 100 disables the hysteresis.
accept_threshold_percent = 87
# Whether the shrinker proactively writes cold pages to the backing swap.
shrinker_enabled = true
# Name of the systemd oneshot service unit that repeats the writes at boot.
service_unit_name = "zswap.service"

[zram_service]
# Aggressive in-memory swap parameters (docs/spec/users-and-host.md).
# The device count equals the CPU core count; the total capacity is
# memory_fraction_percent of installed RAM split evenly across the devices
# and rounded down to the alignment_bytes zram page size. Every device uses
# the compressor algorithm and is activated with swap_priority, so ZRAM
# swap is preferred over the disk swapfile.
# Compression algorithm applied to every device.
compressor = "zstd"
# Swap priority; ZRAM must rank above the disk swapfile.
swap_priority = 1111
# Total ZRAM capacity as a percentage of installed RAM, 1 to 100.
memory_fraction_percent = 96
# CPU core count used when the real count cannot be determined.
fallback_cpu_count = 8
# Byte boundary the zram driver requires for disksize values.
alignment_bytes = 4096
# Retries of a reset or hot_remove rejected with EBUSY while a transient
# opener, for example a udev probe, holds the device.
reset_busy_attempts = 5
# Pause in seconds between two retry attempts.
reset_busy_retry_delay_seconds = 0.5
# Name of the systemd oneshot service unit that repeats the setup at boot.
service_unit_name = "zram.service"

[i2pd_service_setup]
# i2pd anonymous network router parameters (docs/spec/i2pd-service.md).
# The task installs the newest i2pd release from the GitHub repository as
# a system service and owns the main configuration file.
# GitHub repository of i2pd, owner/name form used by the releases API.
github_repo = "PurpleI2P/i2pd"
# Directory for the downloaded package and checksum files.
download_dir = "/var/lib/pyntara/i2pd-download"
# Name of the systemd service unit installed by the package.
service_unit_name = "i2pd.service"
# Main configuration file the task writes. It must match the --conf path
# of the package unit, otherwise the rendered values are ignored.
config_path = "/etc/i2pd/i2pd.conf"
# i2pd log verbosity: debug, info, warn, error or none.
log_level = "warn"
# Whether the web console is enabled (http.enabled of i2pd.conf).
http_enabled = false
# Whether the SOCKS proxy is enabled (socksproxy.enabled of i2pd.conf).
socks_proxy_enabled = true
# Retry attempts after a failed package install; total attempts are
# retries plus one.
install_retries = 3
# Readiness loop of the forking service: attempts and pause between two
# is-active checks after start or restart.
start_check_attempts = 5
# Pause in seconds between two readiness checks.
start_check_retry_delay_seconds = 1

[system_metrics_setup]
# Runtime parameters of the long-running System Metrics service. The
# deployed service reads this section through the same config loader as
# the installer: system_config_path is the single config of the target
# system (docs/contracts/architecture.md section 3). Every cycle the
# service dispatches committed entries from main_outbox into the channel
# queues and drains the Google Drive channel into the web app; the
# encrypted PDF generation and the Telegram channel replace the
# Google-only sending in a later stage (docs/spec/system-metrics.md).
# Retry mode of the send loop: after a cycle with send attempts and no
# success the service sends one random uploadable entry per cycle and the
# pause grows. The first failed cycle waits backoff_base_seconds, every
# further consecutive failure multiplies the pause by the integer
# backoff_multiplier until backoff_max_seconds; all values are whole
# seconds (docs/spec/system-metrics.md, section Schedule and retry).
backoff_base_seconds = 2
backoff_multiplier = 2
backoff_max_seconds = 14400
# Python version selector for the dedicated venv created by the task.
python_version = "3"
# Syslog priority of a failed vault open by the senders, 0 to 7.
error_priority = 3
# Directory of the dedicated venv the task creates for the deployed
# service on the target machine.
venv_dir = "/usr/local/lib/pyntara/venv"
# Path of the single system config copied from the repository root; the
# deployed service reads it through the same loader as the installer.
system_config_path = "/etc/pyntara/config.toml"
# Path of the system command commit_system_metrics. The task generates
# a thin bash command file at this path from the command template with
# the spool path and the journal identifier embedded, so any user can
# commit without config access and without root privileges.
command_path = "/usr/local/bin/commit_system_metrics"
# Root directory of the System Metrics queue on the target machine. The
# ingest service moves committed files from the spool into main_outbox
# inside this directory; the deployed service fans them out into the
# channel queues and archives sent files (docs/spec/system-metrics.md,
# section Queue architecture).
system_metrics_dir = "/var/lib/pyntara/metrics"
# File mode of every queue directory (system_metrics_dir, main_outbox,
# temp and the channel queues), as an octal string. Queue entries carry
# potential secrets, so the mode is the strictest possible, root only.
system_metrics_dir_mode = "0700"
# File mode of every queue entry, as an octal string.
queue_file_mode = "0600"
# Maximum size of a single committed file in bytes; larger files are
# rejected by the ingest service and by the sender.
max_queue_file_size_bytes = 104857600
# Order in which the deployed service sends queued entries: oldest_first
# sends the earliest committed entry first, newest_first the latest.
send_order = "oldest_first"
# Length of the random alphanumeric suffix appended to the original file
# name of every queue entry after a dot. The suffix lets entries with
# identical original names coexist; the sender strips it before upload,
# so the remote server receives the original name.
queue_file_suffix_length = 12
# Directory of the System Metrics spool: the intake directory where the
# generated commit_system_metrics command publishes files for the ingest
# service to move into main_outbox. The path is a behavioral value and
# therefore lives in the config (architecture contract section 3).
spool_dir = "/var/spool/system_metrics"
# File mode of the spool directory, as an octal string. The mode is 1733:
# sticky, write and search for everyone, no listing, so spool entry names
# stay private; the commit command creates entries with queue_file_mode.
spool_dir_mode = "1733"
# File mode of the generated commit_system_metrics command file.
command_file_mode = "0755"
# Name of the long-running System Metrics service unit file.
service_unit_name = "system_metrics.service"
# Name of the ingest oneshot service unit file, started by the path unit.
ingest_service_unit_name = "system_metrics-ingest.service"
# Name of the ingest path unit that watches the spool directory.
ingest_path_unit_name = "system_metrics-ingest.path"
# Journal identifier of the System Metrics services.
service_journal_identifier = "system_metrics"
# Journal identifier of the commit command.
commit_journal_identifier = "commit_system_metrics"
# Name of the intake queue directory inside system_metrics_dir.
main_outbox_dir = "main_outbox"
# Name of the temp queue directory inside system_metrics_dir.
temp_dir = "temp"
# Prefix of temporary files the commit command creates in the spool
# before publishing; entries with this prefix are never ingested.
spool_temp_prefix = ".commit-"
# Publication attempts before the ingest gives up on a unique queue name.
queue_link_attempts = 5
# Name of the Google Drive channel queue directory inside system_metrics_dir.
# The dispatcher links every main_outbox entry here; the Google sender drains
# it into the web app and moves sent entries to main_sent.
google_script_dir = "google_script"
# Name of the sent archive directory inside system_metrics_dir. Senders move
# successfully sent entries here.
main_sent_dir = "main_sent"
# curl timeout of a single Google Drive channel upload, in seconds.
google_script_timeout_seconds = 60
# Title of the vault entry that carries the Google Drive web app
# credentials: url holds the endpoint, password holds the shared auth
# key (docs/spec/secrets-model.md). The value must name an entry of the
# [vault_structure] table.
google_script_key_entry_title = "google_script_key"
# Python regular expression of the Google web app deployment URL. The
# pattern must contain exactly one capture group: the deploy helper
# extracts the deployment ID from the group, so a pattern without a
# capture group is a config error. Written as a TOML literal string
# (single quotes) so the backslashes stay literal.
google_script_deployment_url_regex = '^https://script\.google\.com/macros/s/([A-Za-z0-9_-]+)/exec$'

[system_metrics_setup.collector]
# Report collector parameters (docs/spec/system-metrics.md, section
# Report collector). The collector is a producer of the System Metrics
# queue: the systemd timer system_metrics_collector.timer starts the
# oneshot service system_metrics_collector.service after boot and at the
# configured daily time; the service runs the configured console
# commands, keeps their full output, waits up to the retry window for
# threshold_percent of the network modules to answer, writes the report
# as report_file_name and commits it through the commit_system_metrics
# command. All waiting happens inside the service, never in systemd:
# boot_delay_seconds only sets the OnBootSec of the timer.
# Seconds after boot before the timer fires the collector service.
boot_delay_seconds = 30
# Time of day of the daily collector run, "HH:MM" or "HH:MM:SS"; the
# timer fires every day at this local time.
daily_send_time = "12:00:00"
# Minimum share of the configured network modules that must have
# answered (status ok) before the report is committed immediately, in
# percent from 0 to 100. Below this share the service retries with the
# geometric backoff below until the retry window is exhausted, then
# commits the report as is. 0 commits after the first collection, 100
# waits for every network module.
threshold_percent = 50
# Retry window of the collector: the geometric backoff below repeats
# collections until retry_max_seconds have passed since the first
# collection. The first retry waits retry_base_seconds, every further
# retry multiplies the pause by retry_multiplier until
# retry_max_seconds; all values are whole seconds.
retry_base_seconds = 2
retry_multiplier = 2
retry_max_seconds = 600
# Seconds a single console command may run before it is killed; the
# same timeout bounds one commit_system_metrics call.
command_timeout_seconds = 15
# Name of the oneshot collector service unit file.
service_unit_name = "system_metrics_collector.service"
# Name of the collector timer unit file.
timer_unit_name = "system_metrics_collector.timer"
# Journal identifier of the collector service.
journal_identifier = "system_metrics_collector"
# Path of the flock lock file. The collector takes a non-blocking
# exclusive lock for the whole run, so two instances (a boot run that
# overran into the daily run) never commit simultaneously; the second
# instance exits.
lock_file_path = "/run/pyntara/system_metrics_collector.lock"
# Name of the committed report file. The report is written under this
# name into the system temp directory and committed through the
# commit_system_metrics command; the queue keeps the name and the random
# suffix of the ingest, so daily reports with the same name coexist in
# the queue.
report_file_name = "network.json"

# Network modules: console commands whose full output forms the network
# section of the report. ready_percent counts only these modules, so the
# collector waits only for addresses. A module reports ok when the
# command exited 0 with non-empty output, empty when it exited 0 with
# empty output, error otherwise (nonzero exit, missing command, timeout).
# Commands are argv arrays, never shell lines. Unconfigured sources are
# simply absent: add or remove modules here without code changes. Future
# candidates, commented out until the services are installed:
# [[system_metrics_setup.collector.network_modules]]
# name = "tor_onion"
# command = ["cat", "/var/lib/tor/hidden_service/hostname"]
# [[system_metrics_setup.collector.network_modules]]
# name = "yggdrasil"
# command = ["yggdrasilctl", "getSelf"]
# [[system_metrics_setup.collector.network_modules]]
# name = "cloudflared"
# command = ["cat", "/home/i/.cloudflared/config.yml"]

[[system_metrics_setup.collector.network_modules]]
name = "ipv4"
command = ["ip", "-4", "addr", "show", "scope", "global"]

[[system_metrics_setup.collector.network_modules]]
name = "ipv6"
command = ["ip", "-6", "addr", "show", "scope", "global"]

# System modules: console commands whose full output forms the system
# section of the report. Their status never affects ready_percent and
# the waiting.
[[system_metrics_setup.collector.system_modules]]
name = "hostname"
command = ["hostname"]

[[system_metrics_setup.collector.system_modules]]
name = "memory"
command = ["free", "-h"]

[[system_metrics_setup.collector.system_modules]]
name = "cpu"
command = ["lscpu"]

[[system_metrics_setup.collector.system_modules]]
name = "disk"
command = ["df", "-h", "/"]

# Vault structure: the single source of truth for the KeePass database
# layout. Both secrets/default.vault and secrets/production.vault follow
# this structure, and any tooling that creates or inspects them must read
# this table (docs/spec/secrets-model.md). The structure is flat: every
# entry lives directly in the root group, the title alone identifies the
# entry, and titles are verbose so the purpose is clear without opening
# the vault. The keys of every entry map one-to-one to the KeePass entry
# field names; the notes field of every entry explains what is stored
# there, who consumes it and why.
[vault_structure]

[[vault_structure.entries]]
title = "pyntara_local_vault_password"
notes = "Password that protects the runtime secret vault at /var/lib/pyntara/secrets/pyntara.vault on the target machine. Read by the local_vault_setup task and written to /etc/pyntara/pass, so the source vault password never opens the runtime vault. The default vault carries a well-known test value mirroring its well-known vault password."

[[vault_structure.entries]]
title = "google_script_key"
notes = "Credentials of the System Metrics Google Drive web app. The username field carries the Apps Script project script ID, the url field carries the web app deployment endpoint (from which the deployment ID is derived), the password field carries the shared auth key that the deployed script mirrors into its ALLOWED_KEYS list. Consumed by the Google script deploy helper and by the System Metrics client. The default vault carries well-known test values mirroring its well-known vault password."

[local_vault_setup]
# Runtime secret vault creation parameters (docs/spec/secrets-model.md).
# The task copies the first source vault that the run password decrypts,
# re-encrypts it with the local vault password and stores the vault and
# the password in fixed system locations, so services that start after
# install can decrypt the vault without user input. Source vault paths are
# relative to the repository root, so the clone can live anywhere on the
# machine; the target paths are absolute and fixed by the secrets spec.
# Path to the production KeePass vault.
source_vault_production = "secrets/production.vault"
# Path to the default KeePass vault, tried when production does not open.
source_vault_default = "secrets/default.vault"
# Target path of the runtime secret vault (file mode 0640, directory 0700).
local_vault_path = "/var/lib/pyntara/secrets/pyntara.vault"
# Target path of the plain root-only vault password file (mode 0400).
pass_file_path = "/etc/pyntara/pass"
# Title of the source vault entry that carries the future local vault
# password. The entry must exist in the [vault_structure] table: the
# config loader rejects a title that is not listed there.
vault_password_entry_title = "pyntara_local_vault_password"
# File modes for the runtime secret storage, as octal strings: the secrets
# directory is 0700, the runtime vault 0640, the password directory 0700
# and the password file 0400 (docs/spec/secrets-model.md).
secrets_dir_mode = "0700"
local_vault_file_mode = "0640"
pass_dir_mode = "0700"
pass_file_mode = "0400"
# Syslog priority used when journaling a serious vault failure, 0 to 7.
error_priority = 3

# Task catalog: single source of truth for task metadata, one [[tasks]]
# entry per task. Each entry has a name, a human-readable description,
# optional dependencies and the install modes it belongs to. The engine
# computes the default task set for a mode and expands selections with
# transitive dependencies. inst.sh never parses this file. A listed task
# without an implemented module is skipped at run time, not a failure.
# Dependencies must name tasks listed earlier in this file: this keeps
# default task sets ordered and rules out dependency cycles.
[[tasks]]
name = "add_extra_repos"
description = "Enable extra Ubuntu archive components: universe, restricted, multiverse."
depends = []
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "cli_tools"
description = "Install curated console utilities: file managers, system and media tools."
depends = ["add_extra_repos"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "swapfile_service_install"
description = "Calculate and configure swapfile from RAM and free disk space."
depends = []
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "zram_service"
description = "Configure aggressive ZRAM by CPU and RAM."
depends = ["swapfile_service_install"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "zswap_service"
description = "Configure aggressive zswap compressed swap cache with zstd."
depends = ["swapfile_service_install"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "local_vault_setup"
description = "Setup local vault for secrets storage"
depends = ["zram_service"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "system_metrics_setup"
description = "Deploy and run the System Metrics service with periodic vault checks."
depends = ["local_vault_setup"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "users_setup"
description = "Create and configure i, j, k users and required groups."
depends = []
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "hostname"
description = "Generate and persist random hostname."
depends = []
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "passwords"
description = "Derive root and user passwords from salt and hostname."
depends = ["users_setup", "hostname"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "sshd_server_setup"
description = "Install and configure SSH service with passwordless login keys."
depends = ["local_vault_setup"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "proxy_server"
description = "Local authenticated proxy service with password and port."
depends = ["local_vault_setup"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "proxy_tunnel"
description = "Local tunnel to remote proxy or VPN."
depends = ["proxy_server"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "power_behavior_configure_kde6"
description = "Configure power behavior, no suspend on lid close or inactivity."
depends = []
modes = ["desktop"]

[[tasks]]
name = "desktop_apps_install"
description = "Desktop defaults: Kate, terminal, language indicator, folders."
depends = ["users_setup"]
modes = ["desktop"]

[[tasks]]
name = "imagemagick_install"
description = "Install latest ImageMagick"
depends = ["add_extra_repos"]
modes = ["server", "desktop"]

[[tasks]]
name = "nextdns_setup_system_wide"
description = "Per-user NextDNS account and system-wide DNS endpoint."
depends = ["users_setup"]
modes = ["minimal", "server", "desktop"]

[[tasks]]
name = "i2pd_service_setup"
description = "Install and configure the latest i2pd from GitHub releases as a system service."
depends = ["add_extra_repos"]
modes = ["server", "desktop"]

